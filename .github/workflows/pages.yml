# Build the Astro site and deploy it to GitHub Pages (project site: https://tommykho.github.io/fiverings/)
# with the official Pages actions. "Deploy from a branch" does NOT work for this repo: it runs Jekyll on the
# raw source and 404s. The AI relay is the existing Vercel relay (GitHub Pages has no server functions).
# One-time setup: Settings → General → Default branch = main; Settings → Pages → Source = "GitHub Actions".
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build for GitHub Pages
        run: npm run build
        env:
          SITE_URL: https://tommykho.github.io
          BASE_PATH: /fiverings
          PUBLIC_RELAY_URL: https://suntze-relay.vercel.app/api/relay
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
